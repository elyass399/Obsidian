<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Wiki Graph</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #uploadPage, #chatPage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #chatPage { display: none; }

        #dragCard {
            border: 2px dashed #555;
            border-radius: 16px;
            padding: 60px 80px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        #dragCard.dragover { border-color: #7c3aed; }
        #dragCard h2 { margin-bottom: 10px; font-size: 1.4rem; }
        #dragCard p { color: #888; margin-bottom: 20px; }

        #fileInfo { color: #aaa; font-size: 0.9rem; }

        input[type="file"] { display: none; }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 16px;
        }

        button:hover { background: #6d28d9; }
        button:disabled { background: #444; cursor: not-allowed; }

        #progressBar {
            width: 400px;
            height: 6px;
            background: #333;
            border-radius: 4px;
            display: none;
        }

        #progressFill {
            height: 100%;
            background: #7c3aed;
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 20px;
            font-size: 0.85rem;
            margin-top: 0;
        }

        .secondary-btn:hover { background: #1a1a1a; }

        #chatBox {
            width: 600px;
            height: 400px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; }
        .user { background: #7c3aed; align-self: flex-end; }
        .bot { background: #2a2a2a; align-self: flex-start; }

        #chatInput {
            display: flex;
            gap: 10px;
            width: 600px;
        }

        #chatInput input {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .btn-row {
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>

<!-- UPLOAD PAGE -->
<div id="uploadPage">
    <div id="dragCard" onclick="document.getElementById('fileInput').click()">
        <h2>📄 Carica PDF</h2>
        <p>Trascina un file qui o clicca per selezionarlo</p>
        <input type="file" id="fileInput" accept=".pdf" onchange="handleFile(this.files[0])">
        <div id="fileInfo">Nessun file selezionato</div>
        <button id="uploadBtn" onclick="event.stopPropagation(); uploadFile()" disabled>Carica</button>
    </div>

    <div id="progressBar"><div id="progressFill"></div></div>

    <div class="btn-row">
        <button class="secondary-btn" onclick="switchToChat()">💬 Salta — vai alla chat</button>
        <button class="secondary-btn" onclick="window.location.href='graph.html'">🔗 Vai al Graph</button>
    </div>
</div>

<!-- CHAT PAGE -->
<div id="chatPage">
    <h2>💬 Chiedimi qualcosa</h2>
    <div id="chatBox"></div>
    <div id="chatInput">
        <input type="text" id="questionInput" placeholder="Es: Cosa è una CNN?" onkeydown="if(event.key==='Enter') sendQuery()">
        <button onclick="sendQuery()">Invia</button>
    </div>
    <div class="btn-row">
        <button class="secondary-btn" onclick="switchToUpload()">📄 Carica nuovo PDF</button>
        <button class="secondary-btn" onclick="window.location.href='graph.html'">🔗 Vai al Graph</button>
    </div>
</div>

<script>
    let selectedFile = null;

    const card = document.getElementById('dragCard');
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('dragover'); });
    card.addEventListener('dragleave', () => card.classList.remove('dragover'));
    card.addEventListener('drop', e => {
        e.preventDefault();
        card.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    function handleFile(file) {
        if (!file || file.type !== 'application/pdf') {
            alert('Solo file PDF!');
            return;
        }
        selectedFile = file;
        const kb = (file.size / 1024).toFixed(1);
        document.getElementById('fileInfo').textContent = `${file.name} — ${kb} KB`;
        document.getElementById('uploadBtn').disabled = false;
    }

    async function uploadFile() {
        if (!selectedFile) return;

        const bar = document.getElementById('progressBar');
        const fill = document.getElementById('progressFill');
        bar.style.display = 'block';
        fill.style.width = '30%';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            fill.style.width = '60%';
            const res = await fetch('http://127.0.0.1:8000/upload', {
                method: 'POST',
                body: formData
            });
            fill.style.width = '100%';
            const data = await res.json();
            if (data.status === 'ok') {
                setTimeout(() => switchToChat(), 500);
            }
        } catch (e) {
            alert('Errore upload: ' + e.message);
            bar.style.display = 'none';
        }
    }

    function switchToChat() {
        document.getElementById('uploadPage').style.display = 'none';
        document.getElementById('chatPage').style.display = 'flex';
    }

    function switchToUpload() {
        document.getElementById('chatPage').style.display = 'none';
        document.getElementById('uploadPage').style.display = 'flex';
    }

    async function sendQuery() {
        const input = document.getElementById('questionInput');
        const question = input.value.trim();
        if (!question) return;

        addMessage(question, 'user');
        input.value = '';

        try {
            const res = await fetch('http://127.0.0.1:8000/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            addMessage(data.answer, 'bot');
        } catch (e) {
            addMessage('Errore: ' + e.message, 'bot');
        }
    }

    function addMessage(text, type) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
