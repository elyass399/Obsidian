<!DOCTYPE html>
<html>
<head>
    <title>Wiki Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; overflow: hidden; }
        
        #backBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 10;
        }

        #tooltip {
            position: fixed;
            background: #1a1a1a;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            display: none;
            border: 1px solid #333;
        }

        .link { stroke: #444; stroke-width: 1.5px; }
        .node { cursor: pointer; }
        .label { fill: #ccc; font-size: 11px; pointer-events: none; }
        .link-label { fill: #666; font-size: 9px; pointer-events: none; }
    </style>
</head>
<body>

<button id="backBtn" onclick="window.location.href='index.html'">← Home</button>
<div id="tooltip"></div>
<svg id="graph"></svg>

<script>
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph")
        .attr("width", width)
        .attr("height", height);

    const g = svg.append("g");

    // Zoom
    svg.call(d3.zoom().on("zoom", e => g.attr("transform", e.transform)));

    const tooltip = document.getElementById("tooltip");

    // Colori per tipo
    const colors = {
        "algoritmo": "#7c3aed",
        "concetto": "#2563eb",
        "dataset": "#059669",
        "metrica": "#d97706",
        "persona": "#dc2626",
        "other": "#6b7280"
    };

    fetch("http://127.0.0.1:8000/graph")
        .then(res => res.json())
        .then(data => {
            // Converti edges → links per D3
            const links = data.edges.map(e => ({
                source: e.from,
                target: e.to,
                relation: e.relation
            }));
            const nodes = data.nodes.map(n => ({
                id: n.name,
                type: n.type
            }));

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(120))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));

            // Links
            const link = g.append("g").selectAll("line")
                .data(links).enter().append("line")
                .attr("class", "link");

            // Link labels
            const linkLabel = g.append("g").selectAll("text")
                .data(links).enter().append("text")
                .attr("class", "link-label")
                .text(d => d.relation);

            // Nodes
            const node = g.append("g").selectAll("circle")
                .data(nodes).enter().append("circle")
                .attr("class", "node")
                .attr("r", 8)
                .attr("fill", d => colors[d.type] || "#6b7280")
                .on("mouseover", (e, d) => {
                    tooltip.style.display = "block";
                    tooltip.textContent = `${d.id} (${d.type})`;
                })
                .on("mousemove", e => {
                    tooltip.style.left = (e.clientX + 12) + "px";
                    tooltip.style.top = (e.clientY - 28) + "px";
                })
                .on("mouseout", () => tooltip.style.display = "none")
                .call(d3.drag()
                    .on("start", (e, d) => {
                        if (!e.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on("end", (e, d) => {
                        if (!e.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    })
                );

            // Node labels
            const label = g.append("g").selectAll("text")
                .data(nodes).enter().append("text")
                .attr("class", "label")
                .text(d => d.id);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                linkLabel
                    .attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2);
                node
                    .attr("cx", d => d.x).attr("cy", d => d.y);
                label
                    .attr("x", d => d.x + 10).attr("y", d => d.y + 4);
            });
        });
</script>
</body>
</html>
